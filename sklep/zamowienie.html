<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zamówienie - Sklep</title>

<meta name="description" content="Formularz zamówienia w sklepie internetowym">

<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Zamówienie</h1>

<form>

<div class="mb-3">
<label for="imie" class="form-label">Imię i nazwisko</label>
<input type="text" id="imie" class="form-control" required>
</div>

<div class="mb-3">
<label for="email" class="form-label">Email</label>
<input type="email" id="email" class="form-control" required>
</div>

<div class="mb-3">
<label for="adres" class="form-label">Adres dostawy</label>
<input type="text" id="adres" class="form-control" required>
</div>

<button type="submit" class="btn btn-success">
Złóż zamówienie
</button>

</form>

</div>

<!-- JS ETAP II -->
<script src="js/zamowienie.js"></script>

<script>
document.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const dane = {
        imie: document.querySelector("#imie").value,
        email: document.querySelector("#email").value,
        adres: document.querySelector("#adres").value
    };

    const bledy = zamowienie.waliduj(dane);

    if (bledy.length > 0) {
        alert("Błędy:\n" + bledy.join("\n"));
        return;
    }

    const wynik = await zamowienie.wyslij(dane);

    alert(wynik.komunikat);

    document.querySelector("form").reset();
});
</script>

</body>
</html>
