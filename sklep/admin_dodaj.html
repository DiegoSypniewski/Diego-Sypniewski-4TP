<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dodaj produkt</title>

<meta name="description"
content="Dodawanie produktów">

<link rel="stylesheet" href="css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Dodaj produkt</h1>

<form>

<div class="mb-3">

<label class="form-label">

Nazwa produktu

</label>

<input
id="nazwa"
type="text"
class="form-control"
required>

</div>


<div class="mb-3">

<label class="form-label">

Cena

</label>

<input
id="cena"
type="number"
class="form-control"
required>

</div>


<div class="mb-3">

<label class="form-label">

Zdjęcie

</label>

<input
type="file"
class="form-control">

</div>


<button
type="button"
onclick="admin.dodajProdukt()"
class="btn btn-success">

Dodaj produkt

</button>

</form>

</div>

<script src="js/admin.js"></script>

</body>

</html>
